name: DepthLab
options:
  bundleIdPrefix: vn.cabinsentinel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P5M34J84PB
targets:
  DepthLab:
    type: application
    platform: iOS
    sources: [DepthLab]
    info:
      path: DepthLab/Info.plist
      properties:
        CFBundleDisplayName: DepthLab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "DepthLab dùng camera và cảm biến độ sâu (LiDAR, TrueDepth) để đo khoảng cách. Dữ liệu chỉ lưu trên máy này, không gửi đi đâu."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.cabinsentinel.depthlab
        TARGETED_DEVICE_FAMILY: "1"
  DepthLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DepthLabTests]
    dependencies:
      - target: DepthLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.cabinsentinel.depthlab.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DepthLab:
    build:
      targets:
        DepthLab: all
    test:
      targets: [DepthLabTests]
